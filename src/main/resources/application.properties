spring.application.name=shiftplanner
server.port=8080

spring.datasource.url=${SHIFTPLANNER_DB_URL:jdbc:mysql://localhost:3306/shiftplannerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SHIFTPLANNER_DB_USERNAME:root}
spring.datasource.password=${SHIFTPLANNER_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

shiftplanner.demo.username=${SHIFTPLANNER_DEMO_USERNAME:demo@shiftplanner.local}
shiftplanner.demo.password=${SHIFTPLANNER_DEMO_PASSWORD:ShiftPlannerDemo123!}
